<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08303a" />
    <title>Hors ligne · Action bla ghla</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #0f2547;
        background: radial-gradient(circle at 20% 0%, #dff0ff, transparent 45%), #f3f7fd;
        text-align: center;
      }
      main { max-width: 340px; }
      img { width: 140px; height: 140px; object-fit: contain; }
      h1 { margin: 12px 0 8px; font-size: 1.5rem; letter-spacing: -0.03em; }
      p { margin: 0 0 22px; color: #5b7194; line-height: 1.55; }
      button {
        padding: 14px 26px;
        border: 0;
        border-radius: 16px;
        background: #08303a;
        color: #fff;
        font: inherit;
        font-weight: 800;
        box-shadow: 0 12px 24px -10px rgba(11, 47, 102, 0.6);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Tu es hors ligne</h1>
      <p>Impossible de joindre le serveur pour le moment. Vérifie ta connexion puis réessaie.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
